[package]
name = "moye"
version = "0.0.1"
edition = "2024"
description = "Self-evolving AI Agent built on rig (Rust LLM framework)"
license = "MIT"
repository = "https://github.com/spmno/moye"

[dependencies]
rig-core = "0.41"
rig-memory = "0.41"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
chrono = "0.4"
shlex = "2"
futures = "0.3"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
dotenvy = "0.15.7"
rig-agent = { version = "0.41", features = ["rmcp"] }
rmcp = { version = "2", features = ["transport-io", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }

[profile.release]
opt-level = 3
