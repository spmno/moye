[package]
name = "moye"
version = "0.0.4"
edition = "2024"
description = "Self-evolving AI Agent built on rig (Rust LLM framework)"
license = "MIT"
repository = "https://github.com/spmno/moye"

[dependencies]
rig-core = "0.42"
rig-memory = "0.42"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
chrono = "0.4"
shlex = "2"
futures = "0.3"
bytes = "1"
ratatui = { version = "0.30", features = ["crossterm"] }
# unified diff 渲染 edit_file 工具调用：纯 Rust，默认特性即可。
# Unified diff rendering for edit_file tool calls: pure Rust, default features suffice.
similar = "2"
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = "0.13"
html2md-rs = "0.12"
# 代码块语法高亮：仅启用 default-fancy（纯 Rust fancy-regex 后端），不拉入 oniguruma C 库。
# Syntax highlighting for code blocks: default-fancy only (pure-Rust fancy-regex), no oniguruma C lib.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "gzip", "brotli", "deflate"] }
dotenvy = "0.15.7"
libc = "0.2"
rig-agent = { version = "0.42", features = ["rmcp"] }
rmcp = { version = "2", features = ["transport-io", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
landlock = "0.4"

[dev-dependencies]
# cargo-nextest + cargo-llvm-cov are cargo subcommands (binaries), not
# libraries — install via `cargo install cargo-nextest cargo-llvm-cov`.
insta = "1"

[profile.release]
opt-level = 3
