[package]
name = "my-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-core = "0.40"
rig-memory = "0.40"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
rustyline = "18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
chrono = "0.4"
shlex = "2"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }

[profile.release]
opt-level = 3
